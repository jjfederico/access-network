<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pay</title>
<style>
:root{--navy:#111;--paper:#FAFAFA;--card:#FFF;--line:#E6E6E6;--ink:#141414;--mut:#8A8A8A;--good:#17418A;--goodbg:var(--bluebg);--warn:#17418A;--warnbg:var(--bluebg);--sand:#F5F5F5;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:#fff;padding:16px 0}
.eyebrow{letter-spacing:2px;font-size:11px;color:var(--mut2)}
h1{font-weight:600;margin:2px 0 0;font-size:22px;letter-spacing:.5px}
main{padding:16px 0 70px}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tot .s{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex:1;min-width:120px}
.tot .s b{display:block;font-size:20px;line-height:1.1}
.tot .s span{font-size:9px;letter-spacing:.5px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(30,41,89,.06);padding:14px;margin-bottom:16px}
.card h2{font-weight:600;letter-spacing:1px;font-size:14px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th{font-weight:500;letter-spacing:.4px;font-size:10.5px;color:var(--navy)}
th.l,td.l{text-align:left}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;display:inline-block}
.chip.paid{background:var(--goodbg);color:var(--good)}
.chip.owed{background:var(--warnbg);color:var(--warn)}
.chip.wait{background:var(--sand);color:var(--mut)}
.ph{color:var(--mut);font-size:14px;padding:16px 4px}
.who{font-size:12.5px;color:var(--mut);margin-top:4px}
.blur{filter:blur(5px);user-select:none;pointer-events:none;display:inline-block}
.coag{font-size:11.5px;color:var(--mut);line-height:1.8}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:4px;flex-shrink:0}
.dot.green{background:var(--good)}.dot.yellow{background:var(--warn)}.dot.red{background:#C0492E}

.roster{width:100%;border-collapse:collapse;font-size:14px}
.roster th{font-weight:500;letter-spacing:.4px;font-size:10.5px;color:var(--navy);padding:8px 10px;border-bottom:2px solid var(--line);text-align:right;white-space:nowrap;cursor:pointer;user-select:none}
.roster th.l{text-align:left}
.roster th:hover{color:var(--ink)}
.roster th .ar{opacity:.35;font-size:9px;margin-left:2px}
.roster td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.roster td.l{text-align:left}
.roster tr.ag{cursor:pointer}
.roster tr.ag:hover td{background:var(--panel)}
.roster tr.ag.open td{background:var(--sand)}
.roster .nm{font-weight:600;font-size:14.5px}
.roster .nm .car{display:inline-block;width:12px;color:var(--mut);font-size:10px;transition:transform .12s}
.roster tr.ag.open .car{transform:rotate(90deg)}
.roster .z{color:var(--mut2)}
.roster tfoot td{padding:10px;border-top:2px solid var(--line);font-weight:700;background:var(--card)}
.det td{background:var(--panel) !important;padding:0 10px 12px}
.det table{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px}
.det th{font-weight:500;letter-spacing:.4px;font-size:9.5px;color:var(--mut);padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.det td{padding:5px 8px;border-bottom:1px solid var(--line);background:transparent !important}
.det td.r{text-align:right}
@media(max-width:640px){
  .roster .hidesm{display:none}
  .roster td,.roster th{padding:8px 6px;font-size:13px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">Grove Property Group</div>
  <h1>My Pay</h1>
  <div class="who" id="who"></div>
</div></header>

<main class="wrap" id="main">
  <div class="ph"><span class="gv-spin" style="vertical-align:-3px;margin-right:8px"></span>Loading your pay…</div>
</main>

<script>
var SHEET_URL="/api/grove";
var SHEET_TOKEN="";
var YEAR="2026";

/* login email -> agent name in Deals & Payouts */
var EMAIL_TO_AGENT={
  "ryan@gpgboston.com":"QUINN",
  "marc@gpgboston.com":"WATERFALL",
  "joe@gpgboston.com":"JOE",
  "tyler@gpgboston.com":"TYLER B.",
  "michelle@gpgboston.com":"MICHELLE",
  "harry@gpgboston.com":"HARRY V.",
  "dan@gpgboston.com":"DAN",
  "melissa@gpgboston.com":"MELISSA",
  "matt@gpgboston.com":"MATT",
  "rburke@gpgboston.com":"BURKE",
  "eleni@gpgboston.com":"ELENI",
  "jfed6745@gmail.com":"COBROKE"
};

function money(n){return '$'+Math.round(Number(n)||0).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* status of one agent's line on a deal */
function lineStatus(deal,line){
  if(line.paid)return {cls:'paid',txt:'Paid'};
  if(deal.fee==='collected')return {cls:'owed',txt:'Owed to you'};
  return {cls:'wait',txt:'Fee not collected'};
}

function agentRows(deals,agent){
  var rows=[];
  deals.forEach(function(d){
    (d.lines||[]).forEach(function(l){
      if(String(l.agent||'')===agent && (Number(l.amount)||0)>0){
        var coAgents=(d.lines||[]).filter(function(x){
          return String(x.agent||'')!==agent && String((x.agent||'').toUpperCase())!=='GROVE' && (Number(x.amount)||0)>0;
        });
        var dotCls=l.paid?'green':(d.fee==='collected'?'yellow':'red');
        var clP='address='+encodeURIComponent(d.property||'')+'&type='+encodeURIComponent(d.type||'Sale');
        if(d.date)clP+='&openedDate='+encodeURIComponent(d.date);
        if(d.dates&&d.dates.offer)clP+='&offer='+encodeURIComponent(d.dates.offer);
        if(d.dates&&d.dates.inspection)clP+='&inspection='+encodeURIComponent(d.dates.inspection);
        if(d.dates&&d.dates.finance)clP+='&finance='+encodeURIComponent(d.dates.finance);
        if(d.dates&&d.dates.closing)clP+='&closing='+encodeURIComponent(d.dates.closing);
        rows.push({
          date:d.date||'',property:d.property||'',
          amount:Number(l.amount)||0,
          total:Number(d.total)||0,
          coAgents:coAgents,
          dotCls:dotCls,
          st:lineStatus(d,l),
          clUrl:'/transaction-checklist.html?prefill=1&'+clP
        });
      }
    });
  });
  rows.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
  return rows;
}

function renderAgent(name,deals){
  var rows=agentRows(deals,name);
  if(!rows.length){return '<div class="empty-card" style="margin-top:14px"><div style="font-size:32px;margin-bottom:10px;opacity:.35">💰</div>No closed deals for '+YEAR+' yet.<br>Your commissions appear here the moment a deal closes.</div>';}
  var earned=0,paid=0,owed=0,wait=0;
  rows.forEach(function(r){earned+=r.amount;if(r.st.cls==='paid')paid+=r.amount;else if(r.st.cls==='owed')owed+=r.amount;else wait+=r.amount;});
  var h='<div class="tot">'+
    '<div class="s"><b>'+money(earned)+'</b><span>Earned '+YEAR+'</span></div>'+
    '<div class="s"><b style="color:var(--good)">'+money(paid)+'</b><span>Paid</span></div>'+
    '<div class="s"><b style="color:var(--warn)">'+money(owed)+'</b><span>Owed to you</span></div>'+
    '<div class="s"><b style="color:var(--mut)">'+money(wait)+'</b><span>Awaiting fee</span></div>'+
  '</div>';
  h+='<div class="card"><h2>Your deals</h2>';
  if(!rows.length){h+='<div class="ph">No deals with your name yet.</div></div>';return h;}
  h+='<table><thead><tr>'+
    '<th class="l">Date</th><th class="l">Property</th>'+
    '<th>Grove fee</th><th>Your split</th>'+
    '<th class="l">Co-agents</th><th class="l">Status</th>'+
  '</tr></thead><tbody>';
  rows.forEach(function(r){
    var coHtml='';
    if(r.coAgents&&r.coAgents.length){
      coHtml='<div class="coag">'+r.coAgents.map(function(ca){
        return esc(ca.agent)+': <span class="blur">'+money(ca.amount)+'</span>';
      }).join('<br>')+'</div>';
    } else { coHtml='<span style="color:#ccc">—</span>'; }
    h+='<tr>'+
      '<td class="l">'+esc(r.date)+'</td>'+
      '<td class="l">'+esc(r.property)+'<br><a href="'+r.clUrl+'" style="font-size:11px;color:var(--mut);text-decoration:none;font-weight:500" title="Transaction checklist">☑ Checklist</a></td>'+
      '<td>'+(r.total?money(r.total):'—')+'</td>'+
      '<td><b>'+money(r.amount)+'</b></td>'+
      '<td class="l">'+coHtml+'</td>'+
      '<td class="l"><span class="dot '+r.dotCls+'"></span><span class="chip '+r.st.cls+'">'+r.st.txt+'</span></td>'+
    '</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function renderOwner(deals){
  var names={};
  deals.forEach(function(d){(d.lines||[]).forEach(function(l){var n=String(l.agent||'');if(n&&n.toUpperCase()!=='GROVE'&&(Number(l.amount)||0)>0)names[n]=true;});});
  OWNER_ROWS=Object.keys(names).map(function(n){
    var rows=agentRows(deals,n);
    var e=0,p=0,o=0,w=0;
    rows.forEach(function(r){e+=r.amount;if(r.st.cls==='paid')p+=r.amount;else if(r.st.cls==='owed')o+=r.amount;else w+=r.amount;});
    return {name:n,rows:rows,earned:e,paid:p,owed:o,wait:w};
  });
  if(!OWNER_ROWS.length)return '<div class="ph">No agent lines yet.</div>';
  return '<div id="rosterBox"></div>';
}

var OWNER_ROWS=[], OPEN={}, OSORT={k:'earned',d:-1};

function osort(k){
  if(OSORT.k===k)OSORT.d=-OSORT.d;
  else{OSORT.k=k;OSORT.d=(k==='name')?1:-1;}
  drawRoster();
}
function otog(n){OPEN[n]=!OPEN[n];drawRoster();}

function drawRoster(){
  var box=document.getElementById('rosterBox');if(!box)return;
  var rows=OWNER_ROWS.slice().sort(function(a,b){
    if(OSORT.k==='name')return a.name.localeCompare(b.name)*OSORT.d;
    return (a[OSORT.k]-b[OSORT.k])*OSORT.d;
  });
  var T={earned:0,paid:0,owed:0,wait:0};
  rows.forEach(function(r){T.earned+=r.earned;T.paid+=r.paid;T.owed+=r.owed;T.wait+=r.wait;});
  function ar(k){return OSORT.k===k?(OSORT.d>0?' \u2191':' \u2193'):' \u21c5';}
  function th(k,lbl,cls){return '<th class="'+(cls||'')+'" onclick="osort(\''+k+'\')">'+lbl+'<span class="ar">'+ar(k)+'</span></th>';}
  var h='<table class="roster"><thead><tr>'+
    th('name','Agent','l')+th('earned','Earned')+th('paid','Paid')+th('owed','Owed now')+th('wait','Awaiting fee','hidesm')+
    '<th class="hidesm">Deals</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var op=!!OPEN[r.name];
    h+='<tr class="ag'+(op?' open':'')+'" onclick="otog(\''+r.name.replace(/'/g,"\\'")+'\')">'+
       '<td class="l nm"><span class="car">\u25B8</span> '+esc(r.name)+'</td>'+
       '<td><b>'+money(r.earned)+'</b></td>'+
       '<td'+(r.paid?' style="color:var(--good)"':' class="z"')+'>'+money(r.paid)+'</td>'+
       '<td'+(r.owed?' style="color:var(--warn);font-weight:700"':' class="z"')+'>'+money(r.owed)+'</td>'+
       '<td class="hidesm'+(r.wait?'':' z')+'">'+money(r.wait)+'</td>'+
       '<td class="hidesm">'+r.rows.length+'</td></tr>';
    if(op){
      h+='<tr class="det"><td colspan="6"><table><thead><tr><th>Date</th><th>Property</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>';
      r.rows.forEach(function(x){
        h+='<tr><td>'+esc(x.date||'\u2014')+'</td><td>'+esc(x.property)+'</td><td class="r"><b>'+money(x.amount)+'</b></td>'+
           '<td><span class="chip '+x.st.cls+'">'+x.st.txt+'</span></td></tr>';
      });
      h+='</tbody></table></td></tr>';
    }
  });
  h+='</tbody><tfoot><tr><td class="l">All agents ('+rows.length+')</td>'+
     '<td>'+money(T.earned)+'</td><td style="color:var(--good)">'+money(T.paid)+'</td>'+
     '<td style="color:var(--warn)">'+money(T.owed)+'</td><td class="hidesm">'+money(T.wait)+'</td><td class="hidesm"></td></tr></tfoot></table>';
  box.innerHTML=h;
}

function load(email,role,agentName){
  fetch(SHEET_URL+'?action=dealsLoad&year='+encodeURIComponent(YEAR))
    .then(function(r){return r.json();})
    .then(function(j){
      var deals=(j&&j.ok&&Array.isArray(j.deals))?j.deals:[];
      var main=document.getElementById('main');
      if(role==='owner'){
        document.getElementById('who').textContent='Owner view \u00b7 everyone\'s pay';
        main.innerHTML=renderOwner(deals);
        if(!OWNER_ROWS.length){main.innerHTML='<div class="empty-card" style="margin-top:14px"><div style="font-size:32px;margin-bottom:10px;opacity:.35">💰</div>No deals recorded for '+YEAR+' yet.<br>Pay for the whole team shows here once deals close.</div>';}
        if(OWNER_ROWS.length){
          var T={earned:0,paid:0,owed:0,wait:0};
          OWNER_ROWS.forEach(function(r){T.earned+=r.earned;T.paid+=r.paid;T.owed+=r.owed;T.wait+=r.wait;});
          main.innerHTML='<div class="tot">'+
            '<div class="s"><b>'+money(T.earned)+'</b><span>Earned '+YEAR+'</span></div>'+
            '<div class="s"><b style="color:var(--good)">'+money(T.paid)+'</b><span>Paid out</span></div>'+
            '<div class="s"><b style="color:var(--warn)">'+money(T.owed)+'</b><span>Payable now</span></div>'+
            '<div class="s"><b style="color:var(--mut)">'+money(T.wait)+'</b><span>Awaiting fee</span></div>'+
          '</div><div class="card"><h2>Agents <span style="font-weight:500;color:var(--mut);font-size:12px;text-transform:none;letter-spacing:0">\u00b7 tap a row to see their deals</span></h2><div id="rosterBox"></div></div>';
          drawRoster();
        }
        return;
      }
      // The server's agentDealName (via /api/me) is the exact spelling used in the
      // Deals & Payouts listing-agent column, so match on that first — it covers Guy,
      // AJ, Brett P. and keeps Tyler's "TYLER BATES" aligned with his booked deals.
      // EMAIL_TO_AGENT stays as a fallback only for anyone the server can't name yet.
      var name=(agentName&&agentName.trim())||EMAIL_TO_AGENT[(email||'').toLowerCase()];
      if(!name){main.innerHTML='<div class="ph">No pay account is linked to '+esc(email)+' yet. Ask the office to add you.</div>';return;}
      document.getElementById('who').textContent=name+' · your closed-deal pay — only you see it';
      main.innerHTML=renderAgent(name,deals);
    })
    .catch(function(){document.getElementById('main').innerHTML='<div class="ph">Could not load right now — try again.</div>';});
}

/* who's logged in */
fetch('/api/me').then(function(r){return r.json();}).then(function(u){
  // Agents now use the combined "My Deals & Pay" page — which shows their own
  // split only, never a deal's total fee. Only the owner keeps the roster view here.
  if(!(u&&u.role==='owner')){ location.replace('/my-deals.html'); return; }
  load(u&&u.email,u&&u.role,u&&u.agentName);
}).catch(function(){
  document.getElementById('main').innerHTML='<div class="ph">Please sign in to the hub to view your pay.</div>';
});
</script>
</body>
</html>
