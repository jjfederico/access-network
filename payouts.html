<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payouts</title>
<style>
:root{
  --paper:#F1F4F8;--card:#FFFFFF;--card2:#F4F6FA;--line:#E4E8EF;--line2:#D5DBE5;
  --ink:#171A20;--mut:#5C6270;--mut2:#8A909C;--blue:#17418A;--blued:#123365;--bluebg:#EAF0FB;
  --good:#2E9E6E;--goodbg:#E6F5EE;--amber:#B7791F;--amberbg:#FBF3E4;--red:#C0492E;--redbg:#FCEDE9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13.5px/1.45 'Inter',system-ui,-apple-system,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:18px 20px 70px}
.eyebrow{font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--mut)}
h1{font-size:23px;margin:2px 0 3px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.d-red{background:var(--red)}.d-amb{background:var(--amber)}.d-blu{background:var(--blue)}.d-grn{background:var(--good)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.ptabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.ptabs span{padding:10px 18px;font-size:14px;font-weight:800;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.ptabs span.on{color:var(--blue);border-bottom-color:var(--blue)}
.topline{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lineseg{display:inline-flex;background:#fff;border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px}
.lineseg span{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer}
.lineseg span.on{background:var(--blue);color:#fff}
.search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;background:#fff}
.search input{border:0;outline:0;font:inherit;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.mstrip{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.mstrip .m{flex:1;padding:12px 16px;border-right:1px solid var(--line)}
.mstrip .m:last-child{border-right:0}
.mstrip .m .n{font-size:19px;font-weight:800}
.mstrip .m .l{font-size:11px;color:var(--mut);margin-top:1px}
.mstrip .good .n{color:var(--good)}.mstrip .blue .n{color:var(--blue)}
.buckets{display:flex;gap:12px;margin-bottom:18px}
.bucket{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.bucket:hover{border-color:var(--blue)}
.bucket.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--bluebg)}
.bucket .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--mut)}
.bucket .dotc{width:9px;height:9px;border-radius:50%}
.bucket.b1 .dotc{background:var(--red)}.bucket.b2 .dotc{background:var(--amber)}.bucket.b3 .dotc{background:var(--good)}
.bucket .amt{font-size:23px;font-weight:800;margin-top:6px}
.bucket .cnt{font-size:12px;color:var(--mut);margin-top:1px}
.bucket.on.b1 .h{color:var(--red)}.bucket.on.b2 .h{color:var(--amber)}.bucket.on.b3 .h{color:var(--good)}
.listhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.listhead .t{font-size:15px;font-weight:800}.listhead .hint{font-size:12px;color:var(--mut2)}
.item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px}
.item .who{flex:1;min-width:0}
.item .who .p{font-weight:700;font-size:14px}
.item .who .m{font-size:12px;color:var(--mut);margin-top:2px}
.item .amtc{font-size:16px;font-weight:800;white-space:nowrap}
.item .amtc small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;text-align:right}
.act{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.act.collect{background:var(--blue);color:#fff}.act:disabled{opacity:.6;cursor:default}
.ledger{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lgh{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 140px;padding:11px 16px;background:var(--card2);font-size:11px;font-weight:800;color:var(--mut)}
.lgh div:not(:first-child){text-align:right}
.lgrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 140px;padding:13px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.lgrow:hover{background:var(--card2)}
.lgrow .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:9px}
.lgrow .av{width:26px;height:26px;border-radius:50%;background:var(--blued);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.lgrow .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lgrow .owed{color:var(--amber);font-weight:800}.lgrow .owed.zero{color:var(--good)}
.settle{justify-self:end;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--good);color:#fff}
.settle:disabled{opacity:.6;cursor:default}
.subrows{display:none;background:var(--card2);padding:4px 16px 12px 49px}
.subrows.show{display:block}
.subrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 140px;padding:7px 0;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
.subrow div:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.lgsum{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 140px;padding:13px 16px;border-top:2px solid var(--line2);font-weight:800}
.lgsum div:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card2);color:var(--mut);font-size:11px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.tag.ua{background:var(--bluebg);color:var(--blued)}.tag.pend{background:var(--amberbg);color:var(--amber)}.tag.coll{background:var(--goodbg);color:var(--good)}
.empty{text-align:center;color:var(--mut2);padding:34px;background:#fff;border:1px solid var(--line);border-radius:12px}
#status{font-size:12px;color:var(--mut2);margin:10px 2px 0}
.legend{font-size:11px;color:var(--mut2);margin-top:8px}
</style></head>
<body>
<div class="wrap">
  <div class="eyebrow">GROVE HQ</div>
  <h1>Payouts</h1>
  <div class="sub">Collect the fees that are in, pay the agents who are owed. <a href="deals-payouts.html" style="color:var(--blue);font-weight:600">Classic view →</a></div>

  <div class="ptabs"><span class="on" id="tab-payouts" onclick="pane('payouts')">Payouts</span><span id="tab-all" onclick="pane('all')">All deals</span></div>

  <div id="pane-payouts">
    <div class="topline">
      <div class="lineseg" id="lineseg"><span class="on" data-t="Sale" onclick="setType('Sale',this)">Sales</span><span data-t="Rental" onclick="setType('Rental',this)">Rentals</span></div>
      <div class="search"><span>⌕</span><input id="q" placeholder="Search a deal or agent…" oninput="render()"></div>
      <a class="btn primary" href="agent-add-deal.html">+ Add deal</a>
    </div>
    <div class="mstrip" id="mstrip"></div>
    <div class="buckets" id="buckets"></div>
    <div id="viewbox"></div>
    <div id="status">Loading…</div>
  </div>

  <div id="pane-all" style="display:none">
    <div class="topline">
      <div class="lineseg"><span class="on" data-t="Sale" onclick="setType('Sale',this)">Sales</span><span data-t="Rental" onclick="setType('Rental',this)">Rentals</span></div>
      <div class="search"><span>⌕</span><input id="q2" placeholder="Search…" oninput="renderAll()"></div>
      <a class="btn" href="deals-payouts.html">Full table &amp; tools →</a>
    </div>
    <div id="allTable"></div>
    <div class="legend">Read-only browse. For filters, export, duplicates, deposits and the landlord tab, use the classic view.</div>
  </div>
</div>

<script>
var URL_='/api/grove', YEAR='2026', TYPE='Sale', VIEW='collect', DEALS=[], BUSY=false;
function $(id){return document.getElementById(id);}
function num(v){return parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0;}
function money(n){n=Math.round(num(n));return '$'+n.toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function keyOf(d){return d.dealId||((d.property||'')+'||'+(d.type||'')+'||'+(d.date||''));}
function dealFee(d){return num(d.total);}
/* a fee is expected once a sale is under agreement / closed; rentals always */
function feeExpected(d){if(String(d.type||'')!=='Sale')return true;var s=String(d.stage||'').toLowerCase();return s.indexOf('under')>=0||s.indexOf('closed')>=0;}
function isCollected(d){return (d.fee||'')==='collected';}
/* Grove is the house: auto-paid once every other agent on the deal is paid */
function syncGrove(d){if(!d||!d.lines)return;var g=null,others=[];d.lines.forEach(function(l){if(l.agent==='GROVE')g=l;else others.push(l);});if(g&&others.length){var want=others.every(function(l){return l.paid;});if(want&&!g.paid){g.paid=true;if(!g.paidDate)g.paidDate=today();}}}

function load(){
  $('status').textContent='Loading…';
  fetch(URL_+'?action=dealsLoad&year='+encodeURIComponent(YEAR)+'&_='+Date.now(),{cache:'no-store'})
   .then(function(r){return r.json();}).then(function(j){
     var arr=(j&&Array.isArray(j.deals))?j.deals:[];
     arr.forEach(function(d){if(d&&!d.id)d.id=keyOf(d);if(!Array.isArray(d.lines))d.lines=[];});
     DEALS=arr;
     try{$('status').textContent='';render();renderAll();}
     catch(e){$('status').textContent='Display error — tell Claude: '+(e&&e.message||e);}
   }).catch(function(){$('status').textContent='Could not reach the office — check your connection.';});
}

/* save one deal back exactly like the classic page (updateDeal, write by column) */
function saveDeal(d){
  return fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'updateDeal',oldKey:(d.id||keyOf(d)),deal:{dealId:d.dealId||'',date:d.date||'',property:d.property,type:d.type,unit:d.unit||'',price:(d.price!=null?d.price:''),total:(d.total!=null?d.total:''),fee:d.fee||'pending',seller:d.seller||'',buyer:d.buyer||'',listing:d.listing||'',client:d.client||'',note:d.note||'',submittedBy:d.submittedBy||'',stage:d.stage||'',dates:d.dates||{},lines:d.lines||[]}})}).then(function(r){return r.json();});
}

function typeDeals(){return DEALS.filter(function(d){return (d.type||'Sale')===TYPE;});}
function q(){var e=$('q');return e?e.value.trim().toLowerCase():'';}
function matches(d){var s=q();if(!s)return true;return ((d.property||'')+' '+(d.unit||'')+' '+(d.lines||[]).map(function(l){return l.agent;}).join(' ')).toLowerCase().indexOf(s)>=0;}

function compute(){
  var ds=typeDeals();
  var collect=[], collectTot=0, payTot=0, paidTot=0, feesTot=0, settledCount=0;
  var led={}; // agent -> {earned,paid,owed,deals:[]}
  function L(a){if(!led[a])led[a]={earned:0,paid:0,owed:0,deals:[]};return led[a];}
  ds.forEach(function(d){
    feesTot+=dealFee(d);
    var expect=feeExpected(d);
    if(expect && !isCollected(d)){collect.push(d);collectTot+=dealFee(d);}
    (d.lines||[]).forEach(function(l){
      if(!l.agent)return;var a=L(l.agent);a.earned+=num(l.amount);
      if(l.paid)a.paid+=num(l.amount);
      if(isCollected(d)&&!l.paid){a.owed+=num(l.amount);a.deals.push({p:d.property,amt:num(l.amount)});}
    });
    if(isCollected(d)){
      var allPaid=(d.lines||[]).length && d.lines.every(function(l){return l.paid;});
      if(allPaid)settledCount++;
    }
  });
  Object.keys(led).forEach(function(a){paidTot+=led[a].paid;if(a!=='GROVE')payTot+=led[a].owed;});
  var groveOwed=led['GROVE']?led['GROVE'].owed:0;
  return {collect:collect,collectTot:collectTot,payTot:payTot+groveOwed,paidTot:paidTot,feesTot:feesTot,settledCount:settledCount,led:led};
}

function render(){
  var C=compute();
  $('mstrip').innerHTML=
    '<div class="m"><div class="n">'+money(C.feesTot)+'</div><div class="l">Fees this year</div></div>'+
    '<div class="m good"><div class="n">'+money(C.paidTot)+'</div><div class="l">Paid out</div></div>'+
    '<div class="m"><div class="n">'+money(C.collectTot)+'</div><div class="l">Still owed to Grove</div></div>'+
    '<div class="m blue"><div class="n">'+money(C.payTot)+'</div><div class="l">Ready to pay agents</div></div>';
  $('buckets').innerHTML=
    '<div class="bucket b1'+(VIEW==='collect'?' on':'')+'" onclick="setView(\'collect\')"><div class="h"><span class="dotc"></span>TO COLLECT</div><div class="amt">'+money(C.collectTot)+'</div><div class="cnt">'+C.collect.length+' fees not in yet</div></div>'+
    '<div class="bucket b2'+(VIEW==='pay'?' on':'')+'" onclick="setView(\'pay\')"><div class="h"><span class="dotc"></span>TO PAY AGENTS</div><div class="amt">'+money(C.payTot)+'</div><div class="cnt">money is in · owed out</div></div>'+
    '<div class="bucket b3'+(VIEW==='settled'?' on':'')+'" onclick="setView(\'settled\')"><div class="h"><span class="dotc"></span>SETTLED</div><div class="amt">'+money(C.paidTot)+'</div><div class="cnt">'+C.settledCount+' deals fully paid</div></div>';
  if(VIEW==='collect')renderCollect(C);
  else if(VIEW==='pay')renderPay(C);
  else renderSettled(C);
}
function renderCollect(C){
  var rows=C.collect.filter(matches);
  var h='<div class="listhead"><div class="t">Fees to collect</div><div class="hint">Tap “Mark collected” when the money lands</div></div>';
  if(!rows.length){h+='<div class="empty">Nothing waiting to be collected. 🎉</div>';}
  rows.forEach(function(d){
    var dotc=(d.fee==='not')?'d-red':((d.fee==='pending')?'d-amb':'d-red');
    h+='<div class="item"><span class="dot '+dotc+'"></span><div class="who"><div class="p">'+esc(d.property)+(d.unit?' <span class="chip">#'+esc(d.unit)+'</span>':'')+'</div><div class="m">'+esc(d.stage||d.type||'')+'</div></div><div class="amtc">'+money(dealFee(d))+'<small>fee owed</small></div><button class="act collect" onclick="markCollected(\''+esc(d.id)+'\',this)">✓ Mark collected</button></div>';
  });
  h+='<button class="btn" style="width:100%;margin-top:6px" onclick="pane(\'all\')">Browse all deals →</button>';
  $('viewbox').innerHTML=h;
}
function renderPay(C){
  var names=Object.keys(C.led).filter(function(a){return C.led[a].owed>0 || C.led[a].earned>0;});
  names.sort(function(a,b){return C.led[b].owed-C.led[a].owed;});
  var qq=q();
  var h='<div class="listhead"><div class="t">Agents to pay</div><div class="hint">Fee is in — settle each person’s balance</div></div><div class="ledger"><div class="lgh"><div>Agent</div><div>Earned YTD</div><div>Paid</div><div>Owed now</div><div></div></div>';
  var tE=0,tP=0,tO=0;
  names.forEach(function(a){
    if(qq && a.toLowerCase().indexOf(qq)<0)return;
    var L=C.led[a];tE+=L.earned;tP+=L.paid;tO+=L.owed;
    var initials=a.replace(/[^A-Za-z ]/g,'').split(' ').map(function(x){return x[0];}).join('').slice(0,2).toUpperCase()||a.slice(0,2).toUpperCase();
    var isG=(a==='GROVE');
    var owedCls=L.owed>0?'owed':'owed zero';
    h+='<div class="lgrow" onclick="tog(\'sub-'+esc(a)+'\')"><div class="nm"><span class="av"'+(isG?' style="background:var(--good)"':'')+'>'+esc(initials)+'</span>'+esc(a)+'</div><div class="num">'+money(L.earned)+'</div><div class="num">'+money(L.paid)+'</div><div class="num '+owedCls+'">'+money(L.owed)+'</div>'+(L.owed>0?('<button class="settle" onclick="payAgent(event,\''+esc(a)+'\',this)">Pay '+money(L.owed)+'</button>'):'<span class="chip" style="justify-self:end">✓ up to date</span>')+'</div>';
    h+='<div class="subrows" id="sub-'+esc(a)+'">'+(L.deals.length?L.deals.map(function(x){return '<div class="subrow"><div>'+esc(x.p)+'</div><div>'+money(x.amt)+'</div><div>$0</div><div>'+money(x.amt)+'</div><div></div></div>';}).join(''):'<div class="subrow"><div style="color:var(--mut2)">Nothing owed — all paid.</div><div></div><div></div><div></div><div></div></div>')+'</div>';
  });
  h+='<div class="lgsum"><div>Total</div><div>'+money(tE)+'</div><div>'+money(tP)+'</div><div style="color:var(--amber)">'+money(tO)+'</div><div></div></div></div>';
  $('viewbox').innerHTML=h;
}
function renderSettled(C){
  $('viewbox').innerHTML='<div class="empty">'+C.settledCount+' deals fully settled this year 🎉<br><span style="font-size:12px">Fee collected and every agent paid.</span></div>';
}

function setType(t,el){TYPE=t;document.querySelectorAll('.lineseg').forEach(function(seg){seg.querySelectorAll('span').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-t')===t);});});render();renderAll();}
function setView(v){VIEW=v;render();}
function pane(id){$('pane-payouts').style.display=(id==='payouts')?'block':'none';$('pane-all').style.display=(id==='all')?'block':'none';$('tab-payouts').classList.toggle('on',id==='payouts');$('tab-all').classList.toggle('on',id==='all');}
function tog(id){var e=document.getElementById(id);if(e)e.classList.toggle('show');}

function markCollected(id,btn){
  if(BUSY)return;var d=DEALS.filter(function(x){return x.id===id;})[0];if(!d)return;
  BUSY=true;btn.disabled=true;btn.textContent='Saving…';
  d.fee='collected';
  saveDeal(d).then(function(j){BUSY=false;$('status').textContent=(j&&j.ok)?'Saved ✓':'Save failed — reload';load();}).catch(function(){BUSY=false;$('status').textContent='Save failed — offline';btn.disabled=false;btn.textContent='✓ Mark collected';});
}
function payAgent(e,agent,btn){
  e.stopPropagation();if(BUSY)return;
  var affected=typeDeals().filter(function(d){return isCollected(d)&&(d.lines||[]).some(function(l){return l.agent===agent&&!l.paid;});});
  var total=0;affected.forEach(function(d){d.lines.forEach(function(l){if(l.agent===agent&&!l.paid)total+=num(l.amount);});});
  if(!affected.length)return;
  if(!confirm('Mark '+money(total)+' paid to '+agent+' across '+affected.length+' deal(s)?'))return;
  BUSY=true;btn.disabled=true;btn.textContent='Saving…';
  affected.forEach(function(d){d.lines.forEach(function(l){if(l.agent===agent&&!l.paid){l.paid=true;l.paidDate=today();}});syncGrove(d);});
  Promise.all(affected.map(function(d){return saveDeal(d);})).then(function(){BUSY=false;$('status').textContent='Paid '+agent+' ✓';load();}).catch(function(){BUSY=false;$('status').textContent='Save failed — reload';load();});
}

/* ALL DEALS (read-only browse) */
function renderAll(){
  var ds=typeDeals().slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var s=($('q2')?$('q2').value.trim().toLowerCase():'');
  if(s)ds=ds.filter(function(d){return ((d.property||'')+' '+(d.unit||'')).toLowerCase().indexOf(s)>=0;});
  var isSale=(TYPE==='Sale');
  var h='<table><thead><tr><th>Date</th><th>Property</th>'+(isSale?'<th>Status</th><th class="r">Price</th>':'')+'<th class="r">Total Fee</th><th>Fee</th></tr></thead><tbody>';
  var tF=0,tP=0;
  ds.forEach(function(d){
    tF+=dealFee(d);tP+=num(d.price);
    var fc=d.fee||'pending';var tag=fc==='collected'?'coll':(fc==='not'?'pend':'pend');var lbl=fc==='collected'?'Collected':(fc==='not'?'Not collected':'Pending');
    h+='<tr><td>'+esc(d.date||'')+'</td><td>'+esc(d.property||'')+(d.unit?' <span class="chip">#'+esc(d.unit)+'</span>':'')+'</td>'+(isSale?('<td><span class="tag ua">'+esc(d.stage||'—')+'</span></td><td class="r">'+(d.price?money(d.price):'—')+'</td>'):'')+'<td class="r"><b>'+money(dealFee(d))+'</b></td><td><span class="tag '+tag+'">'+lbl+'</span></td></tr>';
  });
  h+='</tbody></table>';
  if(!ds.length)h='<div class="empty">No '+TYPE.toLowerCase()+' deals.</div>';
  $('allTable').innerHTML=h;
}
load();
setInterval(function(){if(!BUSY&&document.visibilityState==='visible')load();},30000);
</script>
