<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grove HQ</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E1A2E">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grove HQ">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<!-- self-styled; skip legacy grove.css + hq-bar injection --><div id="hq-bar" hidden></div>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0B;--ink-2:#3F3F46;--mut:#71717A;--faint:#A1A1AA;--line:#E4E8EF;--line-2:#EEF1F5;--bg:#F1F4F8;--surface:#fff;--raised:#F4F6FA;
--accent:#17418A;--accent-hover:#1B3EB0;--accent-weak:#E9F0FA;--warn:#17418A;--warn-bg:#F1F3F7;--warn-line:#E1E4EA;--bad:#C0492E;--bad-bg:#FEF3F2;--bad-line:#F4C7C2;
--sh-sm:0 1px 2px rgba(10,10,11,.05);--sh-lg:0 16px 44px rgba(10,10,11,.14);--r:12px;--r-sm:9px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
h1,h2,h3{letter-spacing:-.02em}
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.side{background:var(--surface);color:var(--ink);border-right:1px solid var(--line2);box-shadow:2px 0 0 var(--line-2),5px 0 16px -8px rgba(20,25,40,.16);display:flex;flex-direction:column;padding:12px 11px;overflow:auto}
.co{position:relative}
.co-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:0;padding:6px 8px 12px;color:var(--ink);cursor:pointer;text-align:left}
.co-id{display:flex;flex-direction:column;min-width:0}
.co-logo{height:22px;width:auto;max-width:150px;object-fit:contain;display:block}
/* Company logos are white artwork (built for the dark rail). On the light rail render
   them ink; in dark mode leave them white. */
.co-logo,.co-opt-logo{filter:brightness(0)}
html.dark .co-logo,html.dark .co-opt-logo{filter:none}
.co-role{font-size:10px;color:var(--mut2);margin-top:4px;text-transform:uppercase;letter-spacing:.13em;font-weight:600}
.co-btn .cv{margin-left:auto;color:var(--mut2);font-size:11px}
.co-menu{position:absolute;top:54px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:20;box-shadow:var(--sh-lg);display:none}
.co-menu.open{display:block}
.co-menu button{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:0;color:var(--ink);padding:9px;border-radius:8px;cursor:pointer;font-size:12.5px;text-align:left}
.co-menu button:hover{background:var(--card2)}
.co-opt-logo{height:17px;width:auto;max-width:118px;object-fit:contain}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--mut);padding:15px 10px 6px;margin:0;background:transparent;border:0;border-radius:0;display:flex;align-items:center}
.grp.c{cursor:pointer;display:flex;align-items:center;user-select:none;border-radius:8px}
.grp.c:hover{background:var(--card2)}
.grp.c .car{margin-left:auto;font-size:10px;opacity:.7;transition:transform .16s}
.grp.c.open .car{transform:rotate(90deg)}
/* small color accent beside each section heading (pre-release 2026-08-09). Change --tk to restyle the dash color everywhere. */
:root{--tk:#17418A}
.tk{display:inline-block;width:15px;height:2px;border-radius:2px;background:var(--tk);margin-left:9px;flex:0 0 auto;align-self:center}
.gsec{overflow:hidden;max-height:0;transition:max-height .22s ease}
.gsec.open{max-height:900px}
.qadd{display:none;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer;border:1.5px solid var(--accent);background:linear-gradient(180deg,#fff, #F6F8FC)}
.qadd .qi{font-size:22px}
.qadd b{font-size:14.5px}
.qadd .sub{display:block;margin-top:2px}
@media (max-width:760px){.qadd{display:flex}}
.ptd-row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line-2)}
.ptd-row:last-child{border-bottom:0}
.pchk{flex:none;width:20px;height:20px;border:1.5px solid #C9CBD3;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;background:#fff}
.pchk svg{width:12px;height:12px;opacity:0}
.ptd-row.dn .pchk{background:var(--ink);border-color:var(--ink)}
.ptd-row.dn .pchk svg{opacity:1}
.ptd-tx{flex:1;font-size:13.5px;cursor:pointer}
.ptd-row.dn .ptd-tx{color:var(--faint);text-decoration:line-through}
.ptd-del{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;opacity:0;transition:.12s;padding:2px 6px}
.ptd-row:hover .ptd-del{opacity:1}
.pbar{height:6px;background:var(--line-2);border-radius:20px;overflow:hidden;margin:4px 0 12px}
.pbar span{display:block;height:100%;background:var(--ink);border-radius:20px;transition:width .25s}
.pin{display:flex;gap:8px;margin-bottom:12px}
.pin input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;background:var(--raised)}
.pin input:focus{outline:none;border-color:var(--ink);background:#fff}
.pin .btn{padding:8px 13px;border-radius:9px;flex:none;font-size:13px;font-weight:600;line-height:1.25}
.pnote-ta{width:100%;height:190px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:13.5px;resize:vertical;background:var(--raised)}
.pnote-ta:focus{outline:none;border-color:var(--ink);background:#fff}
.plinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.plink{display:flex;flex-direction:column;align-items:flex-start;gap:7px;border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;background:#fff;font:inherit;text-align:left;transition:.13s}
.plink:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--sh-sm)}
.plink .pi{font-size:19px}
.plink b{font-size:13px}
.plink .sub{font-size:11px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2,#2A2E37);font-size:13.5px;font-weight:500;cursor:pointer}
.nav a .ic{width:19px;text-align:center;opacity:.9;font-size:14px}
.nav a .tag{margin-left:auto;font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px}
.nav a:hover{background:var(--card2);color:var(--ink)}
.nav a.on{background:var(--accdim);color:var(--acc);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:2px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--acc)}
.nav a.on .ic{color:var(--acc);opacity:1}
.side .ft{margin-top:auto;padding:10px 8px 4px;font-size:11px;color:var(--mut);border-top:1px solid var(--line)}
.side .ft a{color:var(--mut);cursor:pointer}
.col{display:flex;flex-direction:column;min-width:0;height:100vh}
.tbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.tbar .crumb{font-size:15px;font-weight:700}
.tbar .search{display:flex;align-items:center;gap:8px;margin-left:6px;flex:1;max-width:340px;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--mut);cursor:text}
.tbar .search kbd{margin-left:auto;font-size:10.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--faint)}
.tbar .bkp{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}.tbar .bkp .d{width:7px;height:7px;border-radius:50%;background:#17418A}
.tbar .u{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
main{flex:1;overflow:auto;position:relative}
.pad{padding:22px}
.wrap{max-width:1080px}
iframe.tool{width:100%;height:100%;border:0;display:block;background:#fff}
.qlrow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;font-size:14px}
.qlrow:hover{background:#f2f5fb}
.qlrow input{width:17px;height:17px;flex:none}
.qlrow .pi{width:20px;text-align:center}
.conav{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;margin-top:12px;padding:9px 10px;border-radius:8px;background:transparent;border:0;color:var(--ink);font-size:13.5px;font-weight:700;letter-spacing:.01em}
.conav:hover{background:var(--card2)}
.conav::before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#6E9BFF}
.conav[data-g="co:grove"]::before{background:#17418A}
.conav[data-g="co:citicore"]::before{background:#0E7C6A}
.conav[data-g="co:summit"]::before{background:#E0674B}
.conav[data-g="co:reserve"]::before{background:#5B8DEF}
.conav .cosub{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--mut2);text-transform:none}
.conav .car{margin-left:auto;font-size:10px;opacity:.7;transition:transform .16s}
.conav.open .car{transform:rotate(90deg)}
.gsec.cosec{padding-left:6px;border-left:2px solid var(--line);margin-left:7px}
.gsec.cosec.open{max-height:2400px}
/* ── Flat workspace switcher ─────────────────────────────────────────────── */
.sidesearch{display:flex;align-items:center;gap:8px;margin:2px 2px 4px;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card2);color:var(--mut);cursor:text;font-size:12.5px}
.sidesearch:hover{border-color:var(--accent);color:var(--ink)}
.sidesearch .ss-ic{font-size:13px}
.sidesearch .ss-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidesearch kbd{font:600 10px Inter,sans-serif;color:var(--mut2);background:var(--card);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.wsw{display:flex;flex-direction:column;gap:3px;margin:2px 0 4px}
.wsb{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.wsb:hover{background:var(--card2)}
.wsb .wsdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--wc)}
.wsb .wsl{font-size:13.5px;font-weight:700;letter-spacing:.01em}
.wsb .wssub{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--mut2)}
.wsb.on{background:var(--wc);border-color:transparent}
.wsb.on .wsl,.wsb.on .wssub{color:#fff}
.wsb.on .wsdot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
.gsec.flat{max-height:none;overflow:visible}
.mpbtn{display:block;width:calc(100% - 20px);margin:14px 10px 6px;padding:8px 10px;background:transparent;border:1px dashed var(--line2);color:var(--mut);border-radius:9px;font:600 12px Inter,sans-serif;cursor:pointer;text-align:center}
.mpbtn:hover{color:var(--ink);border-color:var(--accent)}
.mpbtn.on{background:#17418A;border:0;color:#fff}
.mphint{padding:2px 14px 10px;font-size:10.5px;color:var(--mut2);text-align:center;line-height:1.5}
#sidenav a.mpedit{cursor:default;position:relative;display:flex;align-items:center;gap:8px}
.mpedit.off .nm{text-decoration:line-through;color:var(--mut2)}
.mpedit .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpstar{margin-left:auto;background:none;border:0;cursor:pointer;font-size:14px;line-height:1;opacity:.3;padding:0 2px;color:var(--mut)}
.mpstar:hover{opacity:.7}
.mpstar.on{opacity:1;color:#17418A}
.mptog{background:none;border:1px solid var(--line2);border-radius:20px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 9px;color:var(--mut);flex:none}
.mptog.on{background:var(--accdim);border-color:transparent;color:#17418A}
.pgh{font-size:20px;font-weight:800}.pgs{font-size:12.5px;color:var(--mut);margin:2px 0 18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}.card.p{padding:18px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh-sm)}
.mini .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.mini .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:6px}.mini .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.feature{background:var(--accent);border-color:var(--accent);color:#fff}.feature .l{color:rgba(255,255,255,.72)}.feature .v,.feature .s{color:#fff}.feature .s{color:rgba(255,255,255,.75)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.chip.accent{background:var(--accent-weak);border-color:transparent;color:var(--accent)}.chip.accent .d{background:var(--accent)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}.chip.warn .d{background:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}.chip.bad .d{background:var(--bad)}
.attn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:11px;padding:10px 13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.attn .lb{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable td{padding:10px 4px;border-bottom:1px solid var(--line-2)}.dtable tr:last-child td{border-bottom:0}.dtable .r{text-align:right}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{cursor:pointer;color:var(--accent);font-size:12px;font-weight:600}
.sub{font-size:11px;color:var(--mut)}
.loading{color:var(--mut);font-size:13px;padding:20px}
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.34);display:none;z-index:60;align-items:flex-start;justify-content:center;padding-top:12vh}
.scrim.open{display:flex}
.pal{width:560px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}.pal .in input{border:0;outline:0;font:inherit;font-size:15px;width:100%}
.pal .list{max-height:340px;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px}.pal .it .ic{width:18px;text-align:center;color:var(--mut)}.pal .it.sel{background:var(--accent-weak);color:var(--accent)}
.ham{display:none;background:none;border:0;font-size:19px;line-height:1;cursor:pointer;color:var(--ink);padding:2px 6px 2px 0}
.navscrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65;display:none}
@media(max-width:720px){#app{grid-template-columns:1fr}.ham{display:block}.side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:70;transform:translateX(-100%);transition:transform .22s}.side.open{transform:none;box-shadow:var(--sh-lg)}.navscrim.open{display:block}}
.u{cursor:pointer;background-size:cover;background-position:center 30%;transition:box-shadow .12s}
.u:hover{box-shadow:0 0 0 2px var(--accent-weak)}
.acard{width:340px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);overflow:hidden}
.acard .ah{padding:18px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.apic{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:700;background-size:cover;background-position:center;flex:none}
.acard .an{font-weight:700;font-size:15px;color:var(--ink)}
.acard .ae{font-size:12px;color:var(--ink-2);margin-top:2px;word-break:break-all}
.acard .ab{padding:14px 18px 18px;display:flex;flex-direction:column;gap:9px}
.abtn{width:100%;text-align:center;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.abtn:hover{background:var(--line-2)}
.abtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.abtn.primary:hover{background:var(--accent-hover)}
.abtn.ghost{color:var(--ink-2)}
.astat{font-size:11.5px;color:var(--ink-2);text-align:center;min-height:14px}
.ent3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.entc{cursor:pointer;transition:box-shadow .12s,transform .12s;padding:18px 20px;border-top:3px solid var(--cc,transparent)}
.co-grove{--cc:#17418A}.co-citicore{--cc:#0E7C6A}.co-summit{--cc:#E0674B}.co-access{--cc:#5B8DEF}
.entc.co-grove .enth b,.entc.co-citicore .enth b,.entc.co-summit .enth b,.entc.co-access .enth b{color:var(--cc)}
.entc .entopen{color:var(--cc,var(--accent))!important}
.entc:hover{box-shadow:var(--sh-lg);transform:translateY(-1px)}
.enth{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.enth b{font-size:15px}
.enth span{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
.entbig{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.entsub{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);margin:2px 0 10px}
.entr{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;border-top:1px solid var(--line-2)}
.entr span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.entr b{font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.entopen{margin-top:10px;font-size:12px;font-weight:600;color:var(--accent)}
</style>
<style id="ax-dark-fix">
/* Dark-mode surgical overrides. Base CSS hardcodes light surfaces via :root
   vars and a few literal #fff/gradients; flip the vars, then patch the literals.
   Saturated colored fills (accent blue, feature, avatars) intentionally untouched. */
html.dark{
  --ink:#DDE1E8;--ink-2:#AEB6C2;--mut:#8A92A0;--faint:#6E7686;
  --line:#2A303C;--line-2:#242A34;
  --bg:#111318;--surface:#20252F;--raised:#262C37;
  --accent-weak:#1F2C49;
  --warn:#6E9BFF;--warn-bg:#20252F;--warn-line:#272D38;
  --bad:#E0664A;--bad-bg:#3A1C1C;--bad-line:#5A2E2C;
}
/* Top bar wants bar-shade, not card-shade (shares --surface with cards). */
html.dark .tbar{background:#171B22!important;border-bottom-color:#2A303C!important}
html.dark .tbar .bkp .d{background:#6E9BFF!important}
/* Light gradient CTA -> flat dark card. */
html.dark .qadd{background:#20252F!important}
/* White checkbox surface + light border. */
html.dark .pchk{background:#20252F!important;border-color:#2A303C!important}
/* Literal #fff focus/idle surfaces. */
html.dark .pin input:focus{background:#20252F!important}
html.dark .pnote-ta:focus{background:#20252F!important}
html.dark .plink{background:#20252F!important}
/* Iframe backdrop while a tool loads. */
html.dark iframe.tool{background:#111318!important}
/* Light hover surface on quick-link rows. */
html.dark .qlrow:hover{background:#262C37!important}
/* Theme toggle lives in the top bar now (top-right, by the profile) — hide the injected floating pill on the shell. */
#axThemeBtn{display:none!important}
#themeTop:hover{border-color:var(--acc)!important}
</style></head>
<body>

  <aside class="side" id="side">

function mpApply(groups,co){
  if(ME.role!=='owner'||!MPREFS)return groups;

  var moved=p.moved||{};

  var g=function(k){return fetch('/api/grove?action=notes&notekey='+k+'&_='+Date.now(),{cache:'no-store',credentials:'include'}).then(function(r){return r.json();}).then(function(j){var v=(j&&(j.value||j.notes))||'';try{return JSON.parse(v);}catch(e){return null;}}).catch(function(){return null;});};
  Promise.all([g('ccp_properties'),g('ccp_stmts'),g('owner_uploads')]).then(function(a){
    UPPROPS=Array.isArray(a[0])?a[0]:[]; UPSTMTS=(a[1]&&typeof a[1]==='object')?a[1]:{};
    var b=a[2]||{}; UPBOOKS={citicore:(b.citicore||{}),summit:(b.summit||{})};
    UP_LOADED=true; if(CURURL==='#dash')renderDashboard();
  }).catch(function(){UP_LOADED=true;});
}
function persistBooks(){fetch('/api/grove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notes',notekey:'owner_uploads',value:JSON.stringify(UPBOOKS)})}).catch(function(){});}
function markBook(co,ym){ UPBOOKS[co]=UPBOOKS[co]||{}; if(UPBOOKS[co][ym])delete UPBOOKS[co][ym]; else UPBOOKS[co][ym]=1; persistBooks(); renderDashboard(); }
/* Cell states: 'na' (before start), 'ok' (logged), 'due' (outstanding). */
function upCells(months){
  var rows=[];
  rows.push({kind:'book',co:'citicore',label:'Citicore books',sub:'Monthly bookkeeping export',
    cell:function(ym){return UPBOOKS.citicore[ym]?'ok':'due';}});
  rows.push({kind:'book',co:'summit',label:'Summit books',sub:'Monthly bookkeeping export',
    cell:function(ym){return UPBOOKS.summit[ym]?'ok':'due';}});
  UPPROPS.filter(upOwned).sort(function(a,b){return (b.marketValue||0)-(a.marketValue||0);}).forEach(function(p){
    var start=upStart(p),s=UPSTMTS[p.propId]||{};
    rows.push({kind:'prop',propId:p.propId,label:p.name||'Building',sub:'Owner statement',
      cell:function(ym){ if(ym<start)return 'na'; return s[ym]?'ok':'due'; }});
  });
  return rows;
}

    var o=null; try{o=(j&&j.value)?JSON.parse(j.value):null;}catch(e){}
    ((o&&o.props)||[]).forEach(function(p){ if(!p)return; var addr=String(p.addr||'').trim(); if(!addr)return;
      CIDX.push({type:'Inventory',icon:'▤',label:addr,sub:(p.price?('$'+p.price):'')+(p.off?' · off-market':''),q:addr.toLowerCase(),
        url:'for-sale-folder.html?find='+encodeURIComponent(addr)}); });
  }).catch(function(){}));
  // Saved underwrites. Multifamily is keyed by the property address, so its key is
  // enough. Quick + Full save under a timestamp id (quick:q_… / deal:deal_…), so we
  // fetch each record to pull the real address — otherwise they're unsearchable by
  // address and show a raw id as the label. ?load=<key-suffix> tells the page which
  // saved scenario to open. 'deal:' also matches the typed underwriters — filter those.
  var UWTYPES=[['deal:mf:','multifamily-underwriter.html','Multifamily'],['quick:','quick-underwrite.html','Quick Underwrite'],['deal:','deal-analyzer.html','Full Underwrite']];
  var UWFOREIGN=/^deal:(mf|flip|str|build):/;
  UWTYPES.forEach(function(u){
    jobs.push(fetch('/api/uw?prefix='+encodeURIComponent(u[0])+'&_='+Date.now(),{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      var keys=((j&&j.keys)||[]).map(String).filter(function(k){return !(u[0]==='deal:'&&UWFOREIGN.test(k));});
      if(u[0]==='deal:mf:'){
        keys.forEach(function(k){ var addr=k.slice(u[0].length).trim(); if(!addr)return;
          CIDX.push({type:'Underwrite',icon:'∑',label:addr,sub:u[2],q:(addr+' '+u[2]+' underwrite').toLowerCase(),
            url:u[1]+'?load='+encodeURIComponent(addr)}); });
        return;
      }
      return Promise.all(keys.map(function(k){ var suffix=k.slice(u[0].length).trim(); if(!suffix)return null;
        return fetch('/api/uw/item?key='+encodeURIComponent(k)+'&_='+Date.now(),{credentials:'include'}).then(function(r){return r.ok?r.json():null;}).then(function(it){
          var d=null,v=it&&it.value; try{d=(typeof v==='string')?JSON.parse(v):v;}catch(e){}
          var addr=(d&&String(d.address||d.name||'').trim())||suffix;
          if(/^(q_|deal_)/.test(addr))addr=suffix; // never surface a raw id as the label
          CIDX.push({type:'Underwrite',icon:'∑',label:addr,sub:u[2],q:(addr+' '+u[2]+' underwrite').toLowerCase(),
            url:u[1]+'?load='+encodeURIComponent(suffix)});
        }).catch(function(){});
      }));
    }).catch(function(){}));
  });
  Promise.all(jobs).then(function(){CIDX_LOADED=true;CIDX_LOADING=false;cb&&cb();});
}

var ACCT_PIC='';
function acctInitials(){return (ME.name||'?').split(' ').map(function(w){return (w||'')[0]||'';}).join('').slice(0,2).toUpperCase()||'?';}
function acctPicKey(){return 'profilepic_'+String(ME.email||'').toLowerCase();}
function acctCacheKey(){return 'grove_pic_'+String(ME.email||'').toLowerCase();}
function applyAvatar(url){ACCT_PIC=url||'';var a=$('uav'),p=$('acctPic'),r=$('acctRemove');
  if(url){if(a){a.style.backgroundImage='url('+url+')';a.textContent='';}if(p){p.style.backgroundImage='url('+url+')';p.textContent='';}if(r)r.style.display='';}
  else{var ini=acctInitials();if(a){a.style.backgroundImage='';a.textContent=ini;}if(p){p.style.backgroundImage='';p.textContent=ini;}if(r)r.style.display='none';}}
function acctBoot(){var c='';try{c=localStorage.getItem(acctCacheKey())||'';}catch(e){}applyAvatar(c);
  fetch('/api/grove?action=notes&notekey='+encodeURIComponent(acctPicKey())+'&_='+Date.now(),{credentials:'include'}).then(function(r){return r.json();}).then(function(j){if(!(j&&j.ok))return;var v=j.value||'';if(v){try{localStorage.setItem(acctCacheKey(),v);}catch(e){}applyAvatar(v);}else{try{localStorage.removeItem(acctCacheKey());}catch(e){}applyAvatar('');}}).catch(function(){});}
function acctStatus(t){var s=$('acctStatus');if(s)s.textContent=t||'';}
function openAcct(){$('acctName').textContent=ME.name||'';$('acctEmail').textContent=ME.email||'';acctStatus('');applyAvatar(ACCT_PIC);$('acctScrim').classList.add('open');}

function acctEncode(cv){var q=0.82,u=cv.toDataURL('image/jpeg',q);while(u.length>28000&&q>0.4){q-=0.12;u=cv.toDataURL('image/jpeg',q);}return u;}
function acctPick(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;if(!/^image\//.test(f.type||'')){acctStatus('Please choose an image file.');return;}acctStatus('Processing…');var img=new Image();img.onload=function(){var S=128,cv=document.createElement('canvas');cv.width=S;cv.height=S;var ctx=cv.getContext('2d');var side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)*0.18;ctx.drawImage(img,sx,sy,side,side,0,0,S,S);var url;try{url=acctEncode(cv);}catch(err){acctStatus('Could not process that image.');return;}applyAvatar(url);acctSavePic(url);};img.onerror=function(){acctStatus('Could not read that image.');};var fr=new FileReader();fr.onload=function(){img.src=fr.result;};fr.onerror=function(){acctStatus('Could not read that file.');};fr.readAsDataURL(f);}
function acctSavePic(url){acctStatus('Saving…');try{localStorage.setItem(acctCacheKey(),url);}catch(e){}
  fetch('/api/grove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notes',notekey:acctPicKey(),value:url})}).then(function(r){return r.json();}).then(function(j){acctStatus(j&&j.ok?'Saved ✓':'Saved on this device');}).catch(function(){acctStatus('Saved on this device');});}
function acctRemovePic(){try{localStorage.removeItem(acctCacheKey());}catch(e){}applyAvatar('');acctStatus('Saving…');
  fetch('/api/grove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notes',notekey:acctPicKey(),value:''})}).then(function(r){return r.json();}).then(function(j){acctStatus(j&&j.ok?'Removed ✓':'Removed on this device');}).catch(function(){acctStatus('Removed on this device');});}
function palRender(){var q=$('palIn').value.toLowerCase().trim();var toks=q?q.split(/\s+/):[];
  var pages=PAL.filter(function(it){if(!toks.length)return true;var hay=(it[1]+' '+(it[3]||'')).toLowerCase();return toks.every(function(t){return hay.indexOf(t)>=0;});}).slice(0,toks.length?5:9)
    .map(function(it){return {icon:it[0],label:it[1],sub:'',url:it[2]};});
  var content=toks.length?CIDX.filter(function(it){return toks.every(function(t){return it.q.indexOf(t)>=0;});}).slice(0,8)
    .map(function(it){return {icon:it.icon,label:it.label,sub:it.type+(it.sub?(' · '+it.sub):''),url:it.url};}):[];
  palShown=pages.concat(content);if(palSel>=palShown.length)palSel=0;
  $('palList').innerHTML=palShown.length?palShown.map(function(it,i){return '<div class="it'+(i===palSel?' sel':'')+'" onmouseover="palSel='+i+';palMark()" onclick="palGo('+i+')"><span class="ic">'+it.icon+'</span><span>'+esc(it.label)+(it.sub?(' <small style="color:var(--mut);font-weight:500">'+esc(it.sub)+'</small>'):'')+'</span></div>';}).join(''):'<div class="sub" style="padding:12px">'+(CIDX_LOADING?'Searching…':'No matches')+'</div>';}
function palMark(){Array.prototype.forEach.call(document.querySelectorAll('#palList .it'),function(el,i){el.classList.toggle('sel',i===palSel);});}
function palGo(i){var it=palShown[i];if(!it)return;closePal();go(it.url,it.label);}
function palKey(e){if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palShown.length-1);palMark();}else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);palMark();}else if(e.key==='Enter'){palGo(palSel);}else if(e.key==='Escape'){closePal();}}
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('scrim').classList.contains('open')?closePal():openPal();}});

/* deep-link + refresh: reflect the current view in the URL hash and restore it on load / back-forward */
function hashToUrl(){var h=(location.hash||'').replace(/^#/,'');try{h=decodeURIComponent(h);}catch(e){}if(!h)return '';return (h==='dash'||h==='personal')?('#'+h):h;}
function knownUrl(u){return u==='#dash'||u==='#personal'||PAL.some(function(it){return it[2]===u;});}

function routeFromHash(){var u=hashToUrl();if(!u||!knownUrl(u))return false;go(u,labelFor(u));return true;}
window.addEventListener('hashchange',function(){var u=hashToUrl();if(u&&knownUrl(u)&&u!==CURURL)go(u,labelFor(u));});
