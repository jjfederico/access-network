<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXESS Rolodex — Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1020;--ink:#0A0A0B;--mut:#71717A;--line:#E4E4E7;--sand:#F4F4F6;--good:#17418A;--warn:#B45309;--bad:#C0492E;--card:#fff;--accent:#17418A;--paper:#F4F4F6;--blue:#2450DC;--bluebg:#EEF2FB}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:60px}
header{background:var(--navy);color:#fff;padding:14px 20px}
header .wrap{max-width:1120px;margin:0 auto}
.hublogo{font-family:Inter;font-weight:700;font-size:22px;letter-spacing:.3px}
.tsub{font-size:13px;color:#c7cff0;margin-top:3px}
main.wrap{max-width:1120px;margin:0 auto;padding:18px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.tiles{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tile{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.tile .v{font-size:22px;font-weight:800}
.tile .l{font-size:10px;letter-spacing:.7px;color:var(--mut);font-weight:600;margin-top:3px;text-transform:uppercase}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.good{background:var(--good)}
input[type=search],input.f{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--card);font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;letter-spacing:.04em;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th .ar{opacity:.5;font-size:9px;margin-left:3px}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input.f{padding:6px 8px;font-size:13px;min-width:90px}
.ck{width:20px;height:20px;cursor:pointer;accent-color:var(--good)}
.ckcell{text-align:center}
.rm{background:none;border:0;color:var(--bad);font-size:16px;font-weight:800;cursor:pointer;line-height:1;padding:2px 6px}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.chip.m{background:#E6F4EA;color:#166534}
.muted{color:var(--mut);font-size:13px}
.stat{font-size:12px;color:var(--mut)}
.saveflash{font-size:12px;color:var(--good);font-weight:600;opacity:0;transition:opacity .3s}
.saveflash.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap"><div class="hublogo">📇 AXESS Rolodex</div><div class="tsub" id="who">Agents to reach out to for AXESS — private to you &amp; John</div></div></header>
<main class="wrap">

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="bar">
      <button class="btn good" onclick="addRow()">＋ Add contact</button>
      <input type="search" id="q" placeholder="🔍 Search name, company, email…" oninput="render()" style="flex:1;min-width:200px;max-width:340px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600;cursor:pointer"><input type="checkbox" id="fReached" class="ck" onchange="render()" style="width:16px;height:16px"> Not reached yet</label>
      <span class="saveflash" id="saveflash">Saved ✓</span>
    </div>
    <div style="overflow:auto">
      <table>
        <thead><tr>
          <th onclick="sortBy('name')">Agent name<span class="ar" id="ar-name"></span></th>
          <th onclick="sortBy('company')">Company<span class="ar" id="ar-company"></span></th>
          <th onclick="sortBy('phone')">Number<span class="ar" id="ar-phone"></span></th>
          <th onclick="sortBy('email')">Email<span class="ar" id="ar-email"></span></th>
          <th class="ckcell" onclick="sortBy('reached')" title="Have we reached out?">Reached out<span class="ar" id="ar-reached"></span></th>
          <th class="ckcell" onclick="sortBy('member')" title="Are they a member?">Member<span class="ar" id="ar-member"></span></th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="muted" style="margin-top:10px" id="empty"></div>
  </div>

</main>

<script>
var KEY='axess_rolodex';
var ROWS=[], SORT={col:'name',dir:1}, SAVE_T=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return 'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}

function load(){
  fetch('/api/grove?action=notes&notekey='+KEY+'&_='+Date.now())
    .then(function(r){return r.json();}).then(function(j){
      var raw=j&&(j.value!=null?j.value:j.notes);
      try{ ROWS=raw?JSON.parse(String(raw)):[]; }catch(e){ ROWS=[]; }
      if(!Array.isArray(ROWS))ROWS=[];
      ROWS.forEach(function(r){ if(!r.id)r.id=uid(); });
      render();
    }).catch(function(){ document.getElementById('empty').textContent='Couldn’t load right now — refresh in a moment.'; });
}
function save(){
  clearTimeout(SAVE_T);
  SAVE_T=setTimeout(function(){
    fetch('/api/grove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notes',notekey:KEY,value:JSON.stringify(ROWS)})})
      .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok!==false)flash(); }).catch(function(){});
  },500);
}
function flash(){var f=document.getElementById('saveflash');if(!f)return;f.classList.add('on');clearTimeout(f.__t);f.__t=setTimeout(function(){f.classList.remove('on');},1200);}

function addRow(){ ROWS.unshift({id:uid(),name:'',company:'',phone:'',email:'',reached:false,member:false}); render(true); save(); }
function removeRow(id){ ROWS=ROWS.filter(function(r){return r.id!==id;}); render(); save(); }
function setField(id,field,val){ var r=findRow(id); if(!r)return; r[field]=val; save(); if(field==='reached'||field==='member')render(); }
function findRow(id){ for(var i=0;i<ROWS.length;i++)if(ROWS[i].id===id)return ROWS[i]; return null; }

function sortBy(col){ if(SORT.col===col)SORT.dir=-SORT.dir; else {SORT.col=col;SORT.dir=1;} render(); }

function visible(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var onlyUn=document.getElementById('fReached').checked;
  return ROWS.filter(function(r){
    if(onlyUn && r.reached)return false;
    if(!q)return true;
    return [r.name,r.company,r.phone,r.email].join(' ').toLowerCase().indexOf(q)>=0;
  });
}
function render(focusFirst){
  // tiles
  var total=ROWS.length, reached=ROWS.filter(function(r){return r.reached;}).length, members=ROWS.filter(function(r){return r.member;}).length;
  document.getElementById('tiles').innerHTML=
     '<div class="tile"><div class="v">'+total+'</div><div class="l">Contacts</div></div>'
    +'<div class="tile"><div class="v" style="color:var(--good)">'+reached+'</div><div class="l">Reached out</div></div>'
    +'<div class="tile"><div class="v" style="color:#166534">'+members+'</div><div class="l">Members</div></div>'
    +'<div class="tile"><div class="v" style="color:var(--warn)">'+(total-reached)+'</div><div class="l">Still to contact</div></div>';
  // arrows
  ['name','company','phone','email','reached','member'].forEach(function(c){var el=document.getElementById('ar-'+c);if(el)el.textContent=(SORT.col===c)?(SORT.dir>0?'▲':'▼'):'';});
  var list=visible().slice().sort(function(a,b){
    var va=a[SORT.col], vb=b[SORT.col];
    if(SORT.col==='reached'||SORT.col==='member'){ va=va?1:0; vb=vb?1:0; }
    else { va=String(va||'').toLowerCase(); vb=String(vb||'').toLowerCase(); }
    if(va<vb)return -1*SORT.dir; if(va>vb)return 1*SORT.dir; return 0;
  });
  var host=document.getElementById('rows');
  host.innerHTML=list.map(function(r){
    return '<tr data-id="'+r.id+'">'
      +'<td><input class="f" value="'+esc(r.name)+'" placeholder="Name" oninput="setField(\''+r.id+'\',\'name\',this.value)"></td>'
      +'<td><input class="f" value="'+esc(r.company)+'" placeholder="Company" oninput="setField(\''+r.id+'\',\'company\',this.value)"></td>'
      +'<td><input class="f" value="'+esc(r.phone)+'" placeholder="Phone" oninput="setField(\''+r.id+'\',\'phone\',this.value)"></td>'
      +'<td><input class="f" type="email" value="'+esc(r.email)+'" placeholder="Email" oninput="setField(\''+r.id+'\',\'email\',this.value)"></td>'
      +'<td class="ckcell"><input type="checkbox" class="ck" '+(r.reached?'checked':'')+' onchange="setField(\''+r.id+'\',\'reached\',this.checked)"></td>'
      +'<td class="ckcell"><input type="checkbox" class="ck" '+(r.member?'checked':'')+' onchange="setField(\''+r.id+'\',\'member\',this.checked)">'+(r.member?' <span class="chip m">Member</span>':'')+'</td>'
      +'<td style="text-align:right"><button class="rm" title="Remove" onclick="removeRow(\''+r.id+'\')">✕</button></td>'
      +'</tr>';
  }).join('');
  document.getElementById('empty').textContent = list.length ? '' : (ROWS.length? 'Nothing matches that filter.' : 'No contacts yet — click “Add contact” to start your list.');
  if(focusFirst){ var fi=host.querySelector('tr input'); if(fi)fi.focus(); }
}

load();
</script>
</body>
</html>
