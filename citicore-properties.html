<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citicore — Investments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1020;--blue:#17418A;--bluebg:#E9F0FA;--ink:#0A0A0B;--slate:var(--mut);--mut:#71717A;--line:#E4E4E7;--paper:#F7F7F8;--card:#FFF;--good:#17418A;--goodbg:var(--bluebg);--warn:#17418A;--warnbg:var(--bluebg);--bad:#C0492E;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
.top{background:#17418A;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px}
.top a{color:#cfe0f5;text-decoration:none;font-size:13px}.top h1{font-size:16px;font-weight:700;margin:0}
.top .sync{margin-left:auto;font-size:12px;color:#9fb2d6}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 70px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.tot .t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.tot .t .k{font-size:9.5px;letter-spacing:.04em;color:var(--mut);font-weight:600}
.tot .t .v{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
body.viewer .bar,body.viewer .stmt{display:none!important}
.shareband{background:var(--bluebg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px;color:var(--slate)}
.invrow{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.invrow input{padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px}
.eyebtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;flex:0 0 auto}
.eyebtn.on{background:var(--bluebg);border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:8px 13px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--line)}
.sec2{font:700 12px system-ui,sans-serif;letter-spacing:.1em;color:var(--mut);margin:16px 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tiles.sold .tile{opacity:.85}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .12s,transform .12s;display:flex;flex-direction:column}
.tile:hover{box-shadow:0 8px 24px rgba(11,16,32,.12);transform:translateY(-2px)}
.tile .img{aspect-ratio:16/10;background:var(--panel) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:34px}
.tile .badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.94);color:var(--blue);border-radius:20px;padding:3px 9px}
.tile .badge.sold{color:var(--warn)}.tile .badge.inv{color:var(--mut)}
.tile .body{padding:12px 13px 13px}
.tile h3{font-size:14.5px;font-weight:700;line-height:1.2}
.tile .addr{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .row{display:flex;justify-content:space-between;margin-top:9px;gap:6px}
.tile .row .m .l{font-size:9.5px;color:var(--mut);font-weight:700}
.tile .row .m .n{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .warn{font-size:11px;color:var(--warn);margin-top:7px}
.tile .stmt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.tile .stmt .sbtn{border:1px solid var(--line);background:var(--card);color:var(--blue);border-radius:8px;padding:5px 9px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.tile .stmt .sbtn:hover{background:var(--bluebg)}
.tile .stmt .miss{font-size:11px;font-weight:700;color:var(--bad)}
.tile .stmt .ok{font-size:11px;font-weight:600;color:var(--good)}
.alertbar{background:var(--badbg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.55}
.ph{color:var(--mut);font-size:14px;padding:20px;text-align:center}
.modalbg{position:fixed;inset:0;background:rgba(11,16,32,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
.modalbg.open{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:620px;width:100%;padding:15px}
.modal h2{font-size:15px;margin-bottom:4px}
.f{margin-bottom:12px}.f label{display:block;font-size:11px;letter-spacing:.04em;color:var(--mut);font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.frow{display:flex;gap:10px;flex-wrap:wrap}.frow .f{flex:1;min-width:120px}
.x{float:right;border:0;background:var(--panel);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
/* detail view */
.dhero{margin:-15px -15px 14px;height:180px;background:var(--panel) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:44px;border-radius:14px 14px 0 0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dgrid .m{background:var(--paper);border-radius:10px;padding:9px 11px}
.dgrid .m .l{font-size:10px;color:var(--mut);font-weight:700}
.dgrid .m .n{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
.dtag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;background:var(--bluebg);color:var(--blue);border-radius:20px;padding:2px 9px;margin-right:5px}
.dtag.warn{background:var(--warnbg);color:var(--warn)}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dact button{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer;color:var(--slate)}
.dact button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.photorow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.photorow .pv{width:96px;height:64px;border-radius:10px;background:var(--panel) center/cover no-repeat;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;border:1px solid var(--line)}
@media(max-width:820px){.tot{grid-template-columns:1fr 1fr}.dgrid{grid-template-columns:1fr 1fr}}
.lnktog{display:inline-block;background:none;border:0;color:var(--accent,#17418A);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0;margin:2px 0 10px}
.lnktog:hover{text-decoration:underline}
.adv{display:none}.adv.show{display:block}
</style></head>
<body>
<div class="top"><a href="/">← HQ</a><h1>Citicore · Investments</h1><span class="sync" id="sync">Loading…</span></div>
<div class="wrap">
  <div class="tot" id="totals"></div>
  <div class="bar"><button class="btn" onclick="openEdit(null)">+ Add property</button><button class="btn" onclick="addInvest()" style="background:#8A8F9A">+ Add personal investment</button><button class="btn ghost" onclick="importSnapshot()">⤓ Import from Snapshot</button><button class="btn ghost" onclick="importRR()">⤓ Import from Rent Roll</button><span class="ph" id="hint" style="padding:0"></span></div>
  <div id="grid"></div>
</div>
<div class="modalbg" id="mbg"><div class="modal" id="modal"></div></div>
<input type="file" id="photoPick" accept="image/*" style="display:none">
<input type="file" id="stmtPick" accept=".pdf,.xlsx,.xls,.xlsm,.csv,.tsv,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" multiple style="display:none">
<script>
/* Property backbone — the structured record everything else keys off (propId).
   Stored in the ccp_properties note. Debt is matched from owner_loans by name;
   units/rent can seed from owner_rentroll. Value/equity roll up here and feed the
   Citicore dashboard. Photos are stored as downscaled data URLs on p.photo. */
var PROPS=[],LOANS=[],RR={props:[],years:[]},PORTF=null,SOLD=[],STMTS={},PAYOUTS={},ME={},OWNER=true;
/* Co-investors: p.investors=[{name,email,pct,access}]. p.ownPct = my (owner) share.
   Non-owners only ever receive (server-redacted) the buildings they're invited to,
   with just their own investor entry — so viewerPct reads that entry. */
function viewerPct(p){if(OWNER)return (p.ownPct!=null?num(p.ownPct):100);var e=String(ME.email||'').toLowerCase().trim();var iv=(p.investors||[]).filter(function(x){return String(x.email||'').toLowerCase().trim()===e;})[0];return iv?num(iv.pct):0;}
/* ── Bank-statement income/expense (per property, per month) ─────────────────
   ccp_stmts = { <propId>: { "2026-03": {inc,exp,file,ts}, ... } }. Upload a PDF
   under a tile → parse deposits (in) & withdrawals (out) in-browser → confirm →
   save. Missing months (Jan 2026 → last closed month) alert here + ❗ on the tab. */
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONFULL=['january','february','march','april','may','june','july','august','september','october','november','december'];
function pad2(n){return String(n).length<2?('0'+n):String(n);}
function ymNow(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1);}
function ymLastClosed(){var d=new Date(),y=d.getFullYear(),m=d.getMonth();return m===0?((y-1)+'-12'):(y+'-'+pad2(m));}
function ymAdd(ym,k){var y=+ym.slice(0,4),m=+ym.slice(5)+k;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad2(m);}
function ymRange(a,b){var out=[];if(a>b)return out;var c=a;while(true){out.push(c);if(c===b)break;c=ymAdd(c,1);if(out.length>240)break;}return out;}
function fmtYM(ym){return MON[(+ym.slice(5))-1]+(ym.slice(0,4)!=='2026'?(" '"+ym.slice(2,4)):'');}
function fullYM(ym){return MON[(+ym.slice(5))-1]+' '+ym.slice(0,4);}
function stmtStartYM(p){var pd=parseDate(p.purchaseDate);if(pd&&pd.slice(0,4)==='2026'&&pd.slice(0,7)>'2026-01')return pd.slice(0,7);return '2026-01';}
function reqMonths(p){return ymRange(stmtStartYM(p),ymLastClosed());}
function stmtFor(p){return STMTS[p.propId]||{};}
function missingMonths(p){var s=stmtFor(p);return reqMonths(p).filter(function(ym){return !s[ym];});}
/* ── unit + rent helpers (Rent Roll now lives on each property's units[]) ────── */
function latestYr(r){var ks=Object.keys(r||{}).map(Number).filter(function(n){return !isNaN(n);});return ks.length?Math.max.apply(null,ks):null;}
function unitRent(u){if(!u)return 0;if(u.rent!=null&&u.rent!=='')return num(u.rent);var y=latestYr(u.rents);return y?num(u.rents[y]!=null?u.rents[y]:u.rents[String(y)]):0;}
function propMonthly(p){return (p.units||[]).reduce(function(a,u){return a+unitRent(u);},0);}
function propUnits(p){return (Array.isArray(p.units)&&p.units.length)?p.units.length:(num(p.unitCount)||0);}
function soldFor(p){return SOLD.find(function(s){return norm(s.addr)===norm(p.name)||(p.address&&norm(s.addr)===norm(p.address));});}
var LOAD_ERR=false;
var TYPES=['SF','2-4 unit','5+ multi','mixed-use','condo','commercial','land'];
var STATUS=['owned','under-contract','sold'];
function money(n){n=Number(n)||0;return n>=1e6?'$'+(n/1e6).toFixed(2)+'M':'$'+Math.round(n).toLocaleString('en-US');}
function num(x){return Number(String(x==null?'':x).replace(/[^0-9.\-]/g,''))||0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setSync(t){var e=document.getElementById('sync');if(e)e.textContent=t;}
function uid(){return 'P'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function daysTo(s){if(!s)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(String(s)+'T00:00:00')-t)/864e5);}
function noteRaw(j){return j&&(j.value!=null?j.value:j.notes);}
function loadNote(key){return fetch('/api/grove?action=notes&notekey='+encodeURIComponent(key)+'&_='+Date.now(),{cache:'no-store',credentials:'include'}).then(function(r){return r.json();}).then(function(j){try{return JSON.parse(noteRaw(j)||'null');}catch(e){return null;}}).catch(function(){return null;});}

function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function debtFor(p){var pn=norm(p.name)+' '+norm(p.address);var d=0;LOANS.forEach(function(l){var ln=norm(l.property);if(!ln)return;if(pn.indexOf(ln)>=0||ln.indexOf(norm(p.name))>=0&&norm(p.name))d+=num(l.balance);});return d;}
function equityFor(p){var v=num(p.marketValue);return v?v-debtFor(p):0;}
function bgImg(p){return p.photo?('background-image:url('+p.photo+')'):'';}
function icoImg(p){return p.photo?'':'⌂';}

function isInvest(p){return !!p.invest;}
function isOwned(p){return !p.invest && (p.status||'owned')!=='sold';}
function isSold(p){return !p.invest && (p.status||'owned')==='sold';}
function stmtNet(p){var s=STMTS[p.propId]||{},n=0;Object.keys(s).forEach(function(k){n+=num(s[k].inc)-num(s[k].exp);});return n;}
function curYear(){return String(new Date().getFullYear());}
function netYTD(p){var s=STMTS[p.propId]||{},y=curYear(),n=0;Object.keys(s).forEach(function(k){if(k.slice(0,4)===y)n+=num(s[k].inc)-num(s[k].exp);});return n;}
function stmtCount(p){return Object.keys(STMTS[p.propId]||{}).length;}
/* Personal investments track PREFERRED-RETURN PAYOUTS (from Excel/PDF distribution
   docs), not bank-statement cash flow. PAYOUTS = { propId: [ {id,date:'YYYY-MM-DD',amount,file,fileName,ts} ] }. */
function payArr(p){return (PAYOUTS[p.propId]||[]).slice();}
function payList(p){return payArr(p).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''));});}
function payTotal(p){return payArr(p).reduce(function(a,r){return a+num(r.amount);},0);}
function payYTD(p){var y=curYear();return payArr(p).reduce(function(a,r){return a+(String(r.date||'').slice(0,4)===y?num(r.amount):0);},0);}
function payForYear(p,y){y=String(y);return payArr(p).reduce(function(a,r){return a+(String(r.date||'').slice(0,4)===y?num(r.amount):0);},0);}
function payCount(p){return payArr(p).length;}
function payYears(list){var ys={};list.forEach(function(p){payArr(p).forEach(function(r){var y=String(r.date||'').slice(0,4);if(/^20\d\d$/.test(y))ys[y]=1;});});var a=Object.keys(ys).sort();return a.length?a:[curYear()];}
function initInvest(p){return num(p.cashIn);}
function investCashFlow(){return PROPS.filter(isInvest).reduce(function(a,p){return a+payYTD(p);},0);}
function portfolioCashFlow(){return PROPS.filter(isOwned).reduce(function(a,p){return a+netYTD(p);},0);}
function yearsWithStmts(list){var ys={};list.forEach(function(p){Object.keys(STMTS[p.propId]||{}).forEach(function(k){var y=k.slice(0,4);if(/^20\d\d$/.test(y))ys[y]=1;});});var arr=Object.keys(ys).sort();return arr.length?arr:[curYear()];}
function netForYear(p,y){var s=STMTS[p.propId]||{},n=0;y=String(y);Object.keys(s).forEach(function(k){if(k.slice(0,4)===y)n+=num(s[k].inc)-num(s[k].exp);});return n;}
function portfolioCFYear(y){return PROPS.filter(isOwned).reduce(function(a,p){return a+netForYear(p,y);},0);}
function investCFYear(y){return PROPS.filter(isInvest).reduce(function(a,p){return a+payForYear(p,y);},0);}
function renderTotals(){
  var owned=PROPS.filter(isOwned), sold=PROPS.filter(isSold), invest=PROPS.filter(isInvest);
  var val=owned.reduce(function(a,p){return a+num(p.marketValue);},0);
  var units=owned.reduce(function(a,p){return a+propUnits(p);},0);
  var eq=owned.reduce(function(a,p){return a+(num(p.equity)||equityFor(p));},0);
  var rent=owned.reduce(function(a,p){return a+propMonthly(p);},0);
  var cy=curYear();
  function cfTile(label,val,extra){return '<div class="t"><div class="k">'+label+(extra||'')+'</div><div class="v" style="color:'+(val>=0?'var(--good)':'var(--bad)')+'">'+money(val)+'</div></div>';}
  var pfTiles=yearsWithStmts(owned).map(function(y){return cfTile('Portfolio CF · '+y,portfolioCFYear(y),(y===cy?' · YTD':''));}).join('');
  var invTiles=invest.length?payYears(invest).map(function(y){return cfTile('Personal inv. returns · '+y,investCFYear(y),(y===cy?' · YTD':''));}).join(''):'';
  document.getElementById('totals').innerHTML=
    '<div class="t"><div class="k">Owned</div><div class="v">'+owned.length+(sold.length?(' <span style="font-size:12px;color:var(--mut)">· '+sold.length+' sold</span>'):'')+'</div></div>'+
    '<div class="t"><div class="k">Units</div><div class="v">'+units+'</div></div>'+
    '<div class="t"><div class="k">Value</div><div class="v">'+money(val)+'</div></div>'+
    '<div class="t"><div class="k">Equity</div><div class="v" style="color:var(--good)">'+money(eq)+'</div></div>'+
    '<div class="t"><div class="k">Rent / mo</div><div class="v">'+money(rent)+'</div></div>'+
    pfTiles+invTiles;
}
function tile(p){
  var taxD=daysTo(p.taxDueDate),insD=daysTo(p.insuranceExpiry);
  var warn='';if(taxD!==null&&taxD<=30)warn='Tax due '+taxD+'d';else if(insD!==null&&insD<=30)warn='Ins. expires '+insD+'d';
  var sold=isSold(p),inv=isInvest(p);
  var stripe='',rowHtml='';
  var ytd=netYTD(p),nmc=stmtCount(p);
  if(inv){
    var init=initInvest(p),tot=payTotal(p),pc=payCount(p),retPct=init?(tot/init*100):0;
    rowHtml='<div class="row">'
      +'<div class="m"><div class="l">Initial</div><div class="n">'+(init?money(init):'—')+'</div></div>'
      +'<div class="m"><div class="l">Pref. returns</div><div class="n" style="color:var(--good)">'+(tot?money(tot):'—')+'</div></div>'
      +'<div class="m"><div class="l">Return</div><div class="n">'+((init&&tot)?retPct.toFixed(1)+'%':'—')+'</div></div>'
    +'</div>';
    stripe='<div class="stmt" onclick="event.stopPropagation()"><button class="sbtn" onclick="openDetail(\''+p.propId+'\')">＋ Add payout</button><span class="ok">'+(pc?(money(payYTD(p))+' YTD · '+pc+' payout'+(pc>1?'s':'')):'No payouts yet')+'</span></div>';
  } else {
    rowHtml='<div class="row">'
      +'<div class="m"><div class="l">Units</div><div class="n">'+(propUnits(p)||'—')+'</div></div>'
      +'<div class="m"><div class="l">Value</div><div class="n">'+(num(p.marketValue)?money(p.marketValue):'—')+'</div></div>'
      +'<div class="m"><div class="l">Equity</div><div class="n" style="color:var(--good)">'+((num(p.equity)||num(p.marketValue))?money(num(p.equity)||equityFor(p)):'—')+'</div></div>'
    +'</div>';
    if(!sold){var miss=missingMonths(p),req=reqMonths(p);
      var cov=miss.length?('<span class="miss">❗ Missing '+miss.map(fmtYM).join(', ')+'</span>')
        :(req.length?('<span class="ok">✓ '+fmtYM(req[0])+'–'+fmtYM(req[req.length-1])+'</span>'):'<span class="ok">—</span>');
      var ytdChip=nmc?(' <span class="'+(ytd>=0?'ok':'miss')+'" style="font-weight:700">· YTD '+money(ytd)+'</span>'):'';
      stripe='<div class="stmt" onclick="event.stopPropagation()"><button class="sbtn" onclick="pickStmt(\''+p.propId+'\')">📄 Add statement</button>'+cov+ytdChip+'</div>';}
  }
  return '<div class="tile" onclick="openDetail(\''+p.propId+'\')">'
    +'<div class="img" style="'+bgImg(p)+'"><span class="badge'+(sold?' sold':'')+(inv?' inv':'')+'">'+(inv?'personal':esc(p.status||'owned'))+'</span>'+icoImg(p)+'</div>'
    +'<div class="body"><h3>'+esc(p.name||'Untitled')+'</h3><div class="addr">'+esc(p.address||'no address')+'</div>'
    +rowHtml
    +(warn?('<div class="warn">⚠ '+warn+'</div>'):'')
    +stripe
    +'</div></div>';
}
function byVal(a,b){return num(b.marketValue)-num(a.marketValue);}
function render(){
  renderTotals();
  var g=document.getElementById('grid');
  if(!PROPS.length){g.innerHTML='<div class="ph">No properties yet. Add one, or tap “Import from Snapshot” to seed them from your existing buildings.</div>';document.getElementById('hint').textContent='';return;}
  var owned=PROPS.filter(isOwned).sort(byVal), sold=PROPS.filter(isSold).sort(byVal), invest=PROPS.filter(isInvest).sort(function(a,b){return payTotal(b)-payTotal(a);});
  var alerts=owned.map(function(p){return {p:p,miss:missingMonths(p)};}).filter(function(x){return x.miss.length;});

function savePayout(id){
  if(!OWNER)return;
  var d=(document.getElementById('pay_d_'+id).value||'').trim();
  var a=num(document.getElementById('pay_a_'+id).value);
  if(!a){document.getElementById('pay_a_'+id).focus();return;}
  if(!d){d=new Date().toISOString().slice(0,10);}
  var rec={id:uid(),date:d,amount:a,ts:Date.now()};
  var f=_payFiles[id];
  function commit(){PAYOUTS[id]=PAYOUTS[id]||[];PAYOUTS[id].push(rec);_payFiles[id]=null;persistPayouts();render();openDetail(id);}
  if(f){
    setSync('Uploading doc…');
    var rd=new FileReader();
    rd.onload=function(){var data=String(rd.result||'');var i=data.indexOf(',');if(i>=0)data=data.slice(i+1);
      fetch('/api/summit-upload',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:f.name,mime:f.type||'application/octet-stream',size:f.size,data:data})})
        .then(function(r){return r.json();}).then(function(j){if(j&&j.ok){rec.file=j.url||j.view||'';rec.fileName=j.name||f.name;}commit();})
        .catch(function(){commit();});
    };
    rd.readAsDataURL(f);
  } else commit();
}

  var added=0,updated=0;
  rows.slice(1).forEach(function(r){
    var addr=String(r[iAddr]||'').trim();if(!addr||/^total/i.test(addr))return;
    var key=norm(addr);
    var units=iUnits>=0?(parseInt(String(r[iUnits]).replace(/[^0-9]/g,''))||0):0;
    var rec={name:addr,address:addr,entity:iLLC>=0?String(r[iLLC]||'').trim():'',type:inferType(iType>=0?r[iType]:'',units),unitCount:units,marketValue:num(iMV>=0?r[iMV]:0),purchasePrice:num(iPP>=0?r[iPP]:0),purchaseDate:parseDate(iPD>=0?r[iPD]:''),status:(iSale>=0&&String(r[iSale]||'').trim())?'sold':'owned',snapKey:key};
    var exist=PROPS.find(function(p){return (p.snapKey&&p.snapKey===key)||norm(p.name)===key;});
    if(exist){exist.snapKey=key;if(!num(exist.marketValue)&&rec.marketValue)exist.marketValue=rec.marketValue;if(!num(exist.unitCount)&&rec.unitCount)exist.unitCount=rec.unitCount;if(!exist.entity&&rec.entity)exist.entity=rec.entity;if(!num(exist.purchasePrice)&&rec.purchasePrice)exist.purchasePrice=rec.purchasePrice;updated++;}
    else{rec.propId=uid();rec.notes='Imported from Portfolio Snapshot';PROPS.push(rec);added++;}
  });
  render();persist();
  alert('Imported '+added+' propert'+(added===1?'y':'ies')+(updated?(' · updated '+updated+' existing'):'')+' from the snapshot. Review addresses/values on each.');
}
function applyRole(){
  OWNER=(ME.role==='owner');
  if(!OWNER){document.body.classList.add('viewer');var t=document.querySelector('.top h1');if(t)t.textContent='Citicore · My Investments';}
}
function load(){
  setSync('Loading…');
  fetch('/api/me',{credentials:'include'}).then(function(r){return r.json();}).then(function(j){ME=j||{};}).catch(function(){}).then(function(){applyRole();
  Promise.all([
    fetch('/api/grove?action=notes&notekey=ccp_properties&_='+Date.now(),{cache:'no-store',credentials:'include'})
      .then(function(r){return r.json();})
      .then(function(j){if(!j||!j.ok)throw new Error('load failed');var d=null;try{d=JSON.parse(noteRaw(j)||'null');}catch(e){}PROPS=Array.isArray(d)?d:[];LOAD_ERR=false;})
      .catch(function(){LOAD_ERR=true;PROPS=[];}),
    loadNote('owner_loans').then(function(d){LOANS=(d&&d.loans)||[];}),
    loadNote('owner_rentroll').then(function(d){RR=d||{props:[],years:[]};}),
    loadNote('owner_portfolio').then(function(d){PORTF=d||null;}),
    loadNote('ccp_sold').then(function(d){SOLD=(d&&d.props)||[];}),
    loadNote('ccp_stmts').then(function(d){STMTS=d&&typeof d==='object'?d:{};}),
    loadNote('ccp_payouts').then(function(d){PAYOUTS=d&&typeof d==='object'?d:{};})
  ]).then(function(){render();setSync('Live ✓');consumeLogStmt();});
  });
}
/* Deep link from the dashboard statement chart: ?logstmt=<propId>&ym=<YYYY-MM>
   opens that property's statement logger straight to the outstanding month. */
function consumeLogStmt(){
  try{
    var q=location.search||'';
    var mId=/[?&]logstmt=([^&]+)/.exec(q), mYm=/[?&]ym=(\d{4}-\d{2})/.exec(q);
    if(!mId)return;
    var id=decodeURIComponent(mId[1]), ym=mYm?mYm[1]:'';
    var p=PROPS.find(function(x){return x.propId===id;});
    if(!p||typeof openStmtConfirm!=='function')return;
    openStmtConfirm(id,ym?{ym:ym}:{}, '');
  }catch(e){}
}
load();
