<style>
:root{--blue:#0064E5;--ink:#0B0C0E;--paper:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden;background:#0B0C0E}
.hero{position:fixed;inset:0;overflow:hidden}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.06);animation:none;filter:grayscale(1) contrast(1.04)}
.slide.on{opacity:1;animation:kb 16s linear forwards}

.scrim{position:absolute;inset:0;background:linear-gradient(105deg,rgba(6,10,20,.82) 0%,rgba(6,10,20,.55) 34%,rgba(6,10,20,.12) 64%,rgba(6,10,20,.30) 100%)}

.wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:30px clamp(24px,6vw,84px)}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:56px;letter-spacing:.04em;line-height:1}
.brand small{font-weight:600;letter-spacing:.12em;opacity:.72;font-size:12px;margin-left:8px}
.tr{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.72}
.mid{margin-top:auto;max-width:640px}

h1{font-size:clamp(34px,5.4vw,62px);line-height:1.02;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.sub{margin-top:18px;font-size:clamp(15px,1.7vw,19px);line-height:1.5;color:#e7ebf2;max-width:520px;font-weight:400}
.gbtn{margin-top:30px;display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f2430;border:none;border-radius:12px;padding:14px 22px;font:600 15px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s}
.gbtn:hover{transform:translateY(-1px);box-shadow:0 12px 38px rgba(0,0,0,.34)}
.gbtn svg{width:20px;height:20px}
.hint{margin-top:14px;font-size:12.5px;color:#c3ccdb;opacity:.85}
.foot{margin-top:34px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fam{display:flex;align-items:center;gap:40px;flex-wrap:wrap}.fam img{width:auto;display:block;opacity:.95}.fam img.l-grove{height:40px}.fam img.l-citi{height:44px}.fam img.l-summit{height:36px}.fam img.l-axess{height:32px}@media(max-width:560px){.fam{gap:26px}.fam img.l-grove{height:32px}.fam img.l-citi{height:35px}.fam img.l-summit{height:29px}.fam img.l-axess{height:26px}}
.fam b{font-weight:600;opacity:.9}
.fam .ax{color:#7fb0ff}
.fam i{opacity:.4;font-style:normal}
.dots{position:absolute;right:clamp(24px,6vw,84px);bottom:30px;display:flex;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s,width .3s}
.dot.on{background:#fff;width:20px;border-radius:7px}
@media(max-width:720px){
 .scrim{background:linear-gradient(0deg,rgba(6,10,20,.86) 8%,rgba(6,10,20,.34) 52%,rgba(6,10,20,.5) 100%)}
 .wrap{padding:22px 22px 26px}
 .brand{font-size:44px}
 .tr{display:none}
 .mid{max-width:none}
 .gbtn{width:100%;justify-content:center}
 .dots{display:none}
 .foot{margin-top:24px}
}
